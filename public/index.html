<html lang="ko">
<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;800&family=Nanum+Gothic+Coding&family=VT323&display=swap">
<style>
/* Layout: a single CRT set centred in a dark room; the canvas is the whole game. Single deliberate dark look. */
[hidden]{display:none!important}
:root{
  --room:#050405;
  --bezel:#151214;
  --bezel-edge:#231e20;
  --label:#6b625a;
  --label-hi:#a59a8c;
  --blood:#7d1717;
  --serif:'Nanum Myeongjo', 'Batang', 'AppleMyungjo', serif;
  --mono:'Nanum Gothic Coding', 'D2Coding', ui-monospace, monospace;
  --osd:'VT323', ui-monospace, monospace;
  color-scheme: dark;
}
html,body{height:100%}
body{
  background:var(--room); color:var(--label-hi); margin:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:12px; box-sizing:border-box; overflow:hidden;
  font-family:var(--mono);
  background-image:radial-gradient(ellipse at 50% 40%, #0d0b0c 0%, var(--room) 70%);
}
.set{
  width:min(100%, calc((100vh - 110px) * 4 / 3));
  width:min(100%, calc((100dvh - 110px) * 4 / 3));
  min-width:0; max-width:100%;
  padding:14px; box-sizing:border-box; border-radius:26px;
  background:linear-gradient(180deg, var(--bezel-edge), var(--bezel) 30%, #0d0b0c);
  box-shadow:0 30px 80px #000, inset 0 1px 0 #2e2729, inset 0 -2px 6px #000;
}
.tv{position:relative; width:100%; aspect-ratio:4/3; border-radius:18px / 14px; overflow:hidden; background:#000;}
#c{display:block; width:100%; height:100%; image-rendering:pixelated; image-rendering:crisp-edges; touch-action:none; cursor:crosshair;}
.glass{position:absolute; inset:0; pointer-events:none; border-radius:inherit;
  background:
    radial-gradient(ellipse at 30% 18%, rgba(255,255,255,.05), transparent 40%),
    radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.65) 100%);
  box-shadow:inset 0 0 40px rgba(0,0,0,.9), inset 0 0 4px rgba(0,0,0,1);
}
.deck{width:min(100%, calc((100dvh - 110px) * 4 / 3)); max-width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; font-size:11px; letter-spacing:.18em; color:var(--label); text-transform:uppercase;}
.deck .brand{font-family:var(--osd); font-size:16px; letter-spacing:.24em}
.deck .brand b{color:var(--blood); font-weight:400}
.deck .btns{display:flex; gap:8px}
.deck button{font:inherit; letter-spacing:.12em; color:var(--label-hi); background:#0e0c0d; border:1px solid #2a2426; border-radius:3px; padding:6px 10px; cursor:pointer;}
.deck button:hover{border-color:#4a3f42}
.deck button:focus-visible{outline:2px solid var(--blood); outline-offset:2px}
#nameForm[hidden]{display:none}
#nameForm{position:absolute; left:50%; top:58%; transform:translate(-50%,-50%); width:60%; display:flex; flex-direction:column; align-items:center; gap:8px;}
#nameInput{width:100%; background:transparent; border:0; border-bottom:1px solid #8a7f72; color:#e8dfd0; font-family:var(--serif); font-size:clamp(16px, 3.4vw, 26px); text-align:center; padding:6px 4px; outline:none; caret-color:#b31f1f;}
#nameForm small{font-size:11px; color:#7a7166; letter-spacing:.1em}
@media (max-width:520px){ .set{padding:7px; border-radius:16px} .tv{border-radius:10px} }
#touchUI{position:absolute; inset:0; pointer-events:none}
#touchUI button{pointer-events:auto; position:absolute; aspect-ratio:1; border-radius:50%; font-family:var(--mono); color:#e8dfd0; background:rgba(10,8,9,.45); border:2px solid rgba(230,220,205,.35); touch-action:none; -webkit-user-select:none; user-select:none; padding:0; line-height:1.2}
#touchUI button:active{background:rgba(230,220,205,.25)}
#tWalk{left:4%; bottom:10%; width:21%; font-size:clamp(12px,3.4vw,18px)}
#tSlash{right:4%; bottom:10%; width:21%; font-size:clamp(12px,3.4vw,18px); background:rgba(90,14,14,.5)!important; border-color:rgba(230,130,130,.55)!important}
#tPoint{right:4%; bottom:10%; width:21%; font-size:clamp(12px,3.4vw,18px); background:rgba(60,50,10,.5)!important; border-color:rgba(230,210,130,.55)!important}
#tBack{right:28%; bottom:6%; width:12%; font-size:clamp(9px,2.4vw,12px)}
#tAct{right:4%; bottom:10%; width:21%; font-size:clamp(12px,3.4vw,18px); background:rgba(90,14,14,.5)!important; border-color:rgba(230,130,130,.55)!important}
#tJoy{position:absolute; left:4%; bottom:7%; width:27%; aspect-ratio:1; border-radius:50%; border:2px solid rgba(230,220,205,.3); background:rgba(10,8,9,.3); pointer-events:auto; touch-action:none}
#tJoyKnob{position:absolute; left:50%; top:50%; width:42%; aspect-ratio:1; border-radius:50%; background:rgba(230,220,205,.35); transform:translate(-50%,-50%)}
.rot{display:none; font-size:11px; color:var(--label); letter-spacing:.08em; margin:0}
@media (pointer:coarse){
  body{padding-block:6px; gap:6px}
  .set{width:min(100%, calc((100dvh - 58px) * 4 / 3)); padding:5px; border-radius:12px}
  .tv{border-radius:8px}
  .deck{width:min(100%, calc((100dvh - 58px) * 4 / 3)); font-size:9px}
  .deck .brand{font-size:12px}
  .deck button{padding:5px 8px}
}
@media (pointer:coarse) and (orientation:portrait){ .rot{display:block} }
#stage{display:flex; flex-direction:column; align-items:center; gap:inherit; width:100%}
body.rot90 #stage{position:fixed; top:0; left:0; width:100vh; width:100dvh; height:100vw; height:100dvw; transform-origin:top left; transform:translateX(100vw) rotate(90deg); justify-content:center; gap:6px; padding:6px max(16px, env(safe-area-inset-top, 0px)); box-sizing:border-box}
body.rot90 .set, body.rot90 .deck{width:min(100%, calc((100vw - 58px) * 4 / 3)); width:min(100%, calc((100dvw - 58px) * 4 / 3))}
body.rot90 .rot{display:none!important}
</style>
</head>
<body>
<div id="stage">
<div class="set" id="set">
  <div class="tv">
    <canvas id="c" width="400" height="300" aria-label="인주 앨리스 게임 화면"></canvas>
    <div class="glass"></div>
    <div id="touchUI" hidden>
      <button type="button" id="tWalk" data-scene="ch1">걷기</button>
      <button type="button" id="tBack" data-scene="ch1">뒤돌아<br>보기</button>
      <button type="button" id="tSlash" data-scene="ch1">베기</button>
      <button type="button" id="tPoint" data-scene="ch3">지목</button>
      <button type="button" id="tAct" data-scene="h3d">베기</button>
      <div id="tJoy" hidden><div id="tJoyKnob"></div></div>
    </div>
    <form id="nameForm" hidden autocomplete="off">
      <input id="nameInput" maxlength="10" aria-label="당신의 이름">
      <small>ENTER</small>
    </form>
  </div>
</div>
<div class="deck">
  <span class="brand">HI-FI <b>●</b> STEREO VHS</span>
  <span class="btns"><button id="pauseBtn" type="button" hidden>■ 정지</button><button id="muteBtn" type="button">소리 끄기</button><button id="orientBtn" type="button" hidden>가로 모드</button><button id="fsBtn" type="button">전체화면</button></span>
</div>
<p class="rot">가로 모드 버튼을 누르면 화면이 더 커져요</p>
</div>

<script src="hard.js?v=11"></script>
<script id="game">
(function(){
'use strict';
const SRC = document.getElementById('game').textContent;
const W = 400, H = 300;
const cv = document.getElementById('c');
const octx = cv.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
const g = buf.getContext('2d', { willReadFrequently: true });
const dk = document.createElement('canvas'); dk.width = W; dk.height = H;
const dg = dk.getContext('2d');
const out = octx.createImageData(W, H);
const SERIF = "'Nanum Myeongjo', 'Batang', serif";
const MONO = "'Nanum Gothic Coding', ui-monospace, monospace";
const OSDF = "'VT323', ui-monospace, monospace";
const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const TOUCH = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || ('ontouchstart' in window);
const vib = p => { try { if (navigator.vibrate) navigator.vibrate(chicken ? (Array.isArray(p) ? p.map(v => Math.max(1, v / 3 | 0)) : Math.max(1, p / 3 | 0)) : p); } catch (e) {} };

/* ---------------- storage ---------------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem('injoo_' + k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('injoo_' + k, JSON.stringify(v)); }catch(e){} }
};
let progress = store.get('prog', 1);
let completed = store.get('done', false);
let playerName = store.get('name', '');
let chicken = store.get('chicken', false);
let hard = false;
let hprog = store.get('hprog', 1);
let hdone = store.get('hdone', false);
let hardSeen = store.get('hardSeen', false);
let modeHard = store.get('modeHard', false);
let endings = store.get('endings', {});            // normal / hardBad / hardTrue / archive
let hroute = store.get('hroute', 'bad');           // 하드 4장에서 고른 길
let hasTape = store.get('tape', false), tapeSeen = store.get('tapeSeen', false), tapePending = store.get('tapePending', false);
let bright = store.get('bright', 2);
let sens = store.get('sens', 5);                   // 시점 감도 1~9
const SENS = [0, .4, .55, .7, .85, 1, 1.2, 1.45, 1.75, 2.1];               // 밝기 0~4
const BRIGHT = [[.72, -4], [.86, -2], [1, 0], [1.2, 7], [1.45, 16]];

/* ---------------- audio ---------------- */
const A = { ctx:null, master:null, noise:null, drone:null, muted:false };
function initAudio(){
  if (A.ctx){ if (A.ctx.state === 'suspended') A.ctx.resume(); unlockMusic(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  const C = new AC(); A.ctx = C;
  const comp = C.createDynamicsCompressor(); comp.threshold.value = -12; comp.ratio.value = 5;
  A.master = C.createGain(); A.master.gain.value = A.muted ? 0 : .9;
  A.master.connect(comp); comp.connect(C.destination);
  const len = C.sampleRate * 2, b = C.createBuffer(1, len, C.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  A.noise = b;
  const hs = C.createBufferSource(); hs.buffer = b; hs.loop = true;
  const hp = C.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3500;
  const hg = C.createGain(); hg.gain.value = .016; hs.connect(hp); hp.connect(hg); hg.connect(A.master); hs.start();
  const hum = C.createOscillator(); hum.frequency.value = 60; const humg = C.createGain(); humg.gain.value = .008;
  hum.connect(humg); humg.connect(A.master); hum.start();
  const dgn = C.createGain(); dgn.gain.value = 0;
  const lp = C.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 220; lp.Q.value = 5;
  const base = [55, 55.7, 41.2];
  const oscs = base.map((f, i) => { const o = C.createOscillator(); o.type = i === 2 ? 'sine' : 'sawtooth'; o.frequency.value = f; o.connect(lp); o.start(); return o; });
  const lfo = C.createOscillator(); lfo.frequency.value = .07; const lg = C.createGain(); lg.gain.value = 90; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
  lp.connect(dgn); dgn.connect(A.master);
  A.drone = { g:dgn, oscs, base };
  unlockMusic();
}
function drone(level, pitch = 1, time = 1.5){
  if (!A.ctx) return;
  if (chicken) level = 0; const t = A.ctx.currentTime, gp = A.drone.g.gain;
  gp.cancelScheduledValues(t); gp.setValueAtTime(gp.value, t); gp.linearRampToValueAtTime(level, t + time);
  A.drone.oscs.forEach((o, i) => { o.frequency.cancelScheduledValues(t); o.frequency.setValueAtTime(o.frequency.value, t); o.frequency.linearRampToValueAtTime(A.drone.base[i] * pitch, t + time); });
}
function route(node, pan){
  if (pan && A.ctx.createStereoPanner){ const p = A.ctx.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, pan)); node.connect(p); p.connect(A.master); }
  else node.connect(A.master);
}
function nz(dur, o = {}){
  const C = A.ctx; if (!C) return;
  const { type = 'bandpass', f = 1000, f2 = 0, q = 1, vol = .3, a = .005, pan = 0, delay = 0 } = o;
  const t = C.currentTime + delay;
  const s = C.createBufferSource(); s.buffer = A.noise; s.loop = true;
  const fl = C.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(f, t); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur); fl.Q.value = q;
  const gn = C.createGain(); gn.gain.setValueAtTime(.0001, t); gn.gain.exponentialRampToValueAtTime(vol, t + a); gn.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(fl); fl.connect(gn); route(gn, pan); s.start(t, Math.random() * 1.5); s.stop(t + dur + .05);
}
function osc(type, f, dur, o = {}){
  const C = A.ctx; if (!C) return;
  const { vol = .2, f2 = 0, a = .005, pan = 0, delay = 0, detune = 0 } = o;
  const t = C.currentTime + delay;
  const os = C.createOscillator(); os.type = type; os.frequency.setValueAtTime(f, t); if (f2) os.frequency.exponentialRampToValueAtTime(f2, t + dur); os.detune.value = detune;
  const gn = C.createGain(); gn.gain.setValueAtTime(.0001, t); gn.gain.exponentialRampToValueAtTime(vol, t + a); gn.gain.exponentialRampToValueAtTime(.0001, t + dur);
  os.connect(gn); route(gn, pan); os.start(t); os.stop(t + dur + .05);
}
function buzz(){
  const C = A.ctx; if (!C) return { set(){}, stop(){} };
  const o = C.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 175;
  const l = C.createOscillator(); l.frequency.value = 11; const lg = C.createGain(); lg.gain.value = 14; l.connect(lg); lg.connect(o.frequency);
  const bp = C.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 420; bp.Q.value = 3;
  const gn = C.createGain(); gn.gain.value = 0; o.connect(bp); bp.connect(gn); gn.connect(A.master); o.start(); l.start();
  return { set(v){ gn.gain.setTargetAtTime(v, C.currentTime, .3); }, stop(){ gn.gain.setTargetAtTime(0, C.currentTime, .1); setTimeout(() => { try{ o.stop(); l.stop(); }catch(e){} }, 600); } };
}
const sfx = {
  tick(){ osc('square', 1700 + Math.random() * 400, .018, { vol:.012 }); },
  step(){ nz(.13, { type:'lowpass', f:520, vol:.12 }); osc('sine', 70, .12, { vol:.1, f2:40 }); },
  snap(){ nz(.06, { type:'highpass', f:1800, vol:.12, pan:(Math.random() - .5) * 1.8 }); },
  slash(){ nz(.2, { type:'highpass', f:700, f2:6500, vol:.28, a:.01 }); },
  hit(){ osc('sine', 120, .4, { vol:.5, f2:32 }); nz(.35, { type:'lowpass', f:900, f2:180, vol:.45 }); osc('sawtooth', 95, .28, { vol:.12, f2:40 }); },
  whisper(dur = 1.6, pan = 0){ for (let i = 0; i < 6; i++) nz(.22 + Math.random() * .35, { type:'bandpass', f:1300 + Math.random() * 1900, q:5, vol:.05 + Math.random() * .05, a:.07, pan:pan + (Math.random() - .5) * .4, delay:i * dur / 6 }); },
  breath(){ for (let i = 0; i < 3; i++){ nz(1.1, { type:'bandpass', f:480, q:.9, vol:.2, a:.55, delay:i * 1.7 }); nz(.8, { type:'bandpass', f:950, q:1, vol:.1, a:.3, delay:i * 1.7 + .95 }); } },
  screech(){ for (let i = 0; i < 4; i++) osc('sawtooth', 280 + Math.random() * 500, 1.05, { vol:.2, f2:1700 + Math.random() * 1600, a:.008 }); nz(1.05, { type:'highpass', f:1400, vol:.5, a:.004 }); osc('square', 58, 1.05, { vol:.28, f2:30 }); },
  sting(){ osc('sawtooth', 520, .35, { vol:.16, f2:1500 }); nz(.35, { type:'highpass', f:2500, vol:.25 }); },
  music(f, cents = 0){ osc('sine', f, 1.5, { vol:.22, a:.003, detune:cents }); osc('sine', f * 2.006, .7, { vol:.07, detune:cents }); osc('triangle', f * 3.01, .25, { vol:.03, detune:cents }); },
  laugh(){ for (let i = 0; i < 7; i++){ const f = 200 - i * 13; osc('sawtooth', f, .1, { vol:.16, delay:i * .13, f2:f * .78 }); nz(.1, { type:'bandpass', f:1050, q:3, vol:.12, delay:i * .13 }); } },
  gun(){ nz(.7, { type:'lowpass', f:5000, f2:110, vol:1, a:.002 }); osc('sine', 85, .55, { vol:.9, f2:28, a:.002 }); },
  heart(){ osc('sine', 55, .16, { vol:.38, f2:40 }); osc('sine', 50, .16, { vol:.28, f2:37, delay:.22 }); },
  thump(){ osc('sine', 95, .12, { vol:.22, f2:45 }); },
  gasp(){ nz(.75, { type:'bandpass', f:650, f2:2300, q:2, vol:.32, a:.04 }); },
  stat(d = .5){ nz(d, { type:'bandpass', f:3000, q:.3, vol:.32, a:.004 }); },
  bell(){ osc('sine', 196, 4, { vol:.18 }); osc('sine', 196 * 2.76, 2.5, { vol:.06 }); osc('sine', 196 * 5.4, 1.2, { vol:.025 }); },
  shh(){ nz(.6, { type:'highpass', f:3200, vol:.14, a:.12 }); },
  clunk(){ osc('square', 62, .09, { vol:.2, f2:38 }); nz(.12, { type:'lowpass', f:1300, vol:.3 }); },
  rew(){ osc('sawtooth', 110, 1.3, { vol:.05, f2:420 }); nz(1.3, { type:'bandpass', f:2000, q:.6, vol:.12 }); }
};

const cute = {
  boing(){ osc('sine', 300, .45, { vol:.3, f2:900 }); osc('sine', 600, .3, { vol:.12, f2:200, delay:.12 }); },
  chime(){ [1046, 1318, 1568].forEach((f, i) => osc('sine', f, .6, { vol:.1, delay:i * .07 })); },
  giggle(){ for (let i = 0; i < 5; i++) osc('triangle', 700 + i * 90, .09, { vol:.12, delay:i * .1, f2:900 + i * 90 }); },
  pop(){ osc('sine', 500, .15, { vol:.3, f2:1200 }); nz(.08, { type:'highpass', f:3000, vol:.15 }); },
  popper(){ nz(.35, { type:'highpass', f:1500, vol:.4, a:.002 }); [1318, 1568, 2093].forEach((f, i) => osc('triangle', f, .5, { vol:.1, delay:.05 + i * .06 })); }
};
{
  const o = Object.assign({}, sfx);
  sfx.screech = () => chicken ? cute.boing() : o.screech();
  sfx.sting = () => chicken ? cute.chime() : o.sting();
  sfx.hit = () => chicken ? cute.pop() : o.hit();
  sfx.laugh = () => chicken ? cute.giggle() : o.laugh();
  sfx.gun = () => chicken ? cute.popper() : o.gun();
  sfx.breath = () => chicken ? null : o.breath();
  sfx.whisper = (d, p) => chicken ? cute.chime() : o.whisper(d, p);
  sfx.boing = () => cute.boing();
}

/* ---------------- music ---------------- */
const TRACKS = { opening:{ url:'opening.mp3' }, cute:{ url:'cute.mp3' } };
const music = { node:null, gain:null, name:null, want:null, wow:false };
// 노래는 <audio> 태그로 받으면서 바로 튼다 (통째로 받아 해독하지 않음 → 느린 데이터·폰 메모리에서도 안정적)
// 소리는 Web Audio로 연결해 필터·음소거가 그대로 적용된다
function trackEl(n){
  const tr = TRACKS[n];
  if (tr.el) return tr;
  const el = new Audio(); el.preload = 'auto'; el.src = tr.url;
  try{ el.preservesPitch = false; el.mozPreservesPitch = false; el.webkitPreservesPitch = false; }catch(e){}
  tr.el = el;
  el.addEventListener('error', () => { // 받다가 끊기면 다시 받기
    setTimeout(() => { try{ const t = el.currentTime; el.src = tr.url; el.load(); if (music.name === n){ el.currentTime = t; const p = el.play(); if (p && p.catch) p.catch(() => {}); } }catch(e){} }, 1500);
  });
  if (A.ctx){
    try{
      const C = A.ctx;
      tr.src = C.createMediaElementSource(el);
      tr.hp = C.createBiquadFilter(); tr.hp.type = 'highpass';
      tr.lp = C.createBiquadFilter(); tr.lp.type = 'lowpass';
      tr.gn = C.createGain(); tr.gn.gain.value = 0;
      tr.src.connect(tr.hp); tr.hp.connect(tr.lp); tr.lp.connect(tr.gn); tr.gn.connect(A.master);
    }catch(e){ tr.src = null; }
  }
  return tr;
}
// 터치·클릭 순간에 노래 태그를 한 번 깨워둔다 (아이폰 등은 이게 있어야 나중에 재생 가능)
function unlockMusic(){
  if (!A.ctx) return;
  for (const n in TRACKS){
    const tr = trackEl(n); if (tr.unlocked || music.name === n) continue;
    const el = tr.el; el.muted = true;

const B32 = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function packSave(){
  let v = 0;
  v |= (clamp(progress, 1, 5) - 1); v |= (clamp(hprog, 1, 5) - 1) << 3;
  v |= (completed ? 1 : 0) << 6; v |= (hdone ? 1 : 0) << 7;
  v |= (endings.normal ? 1 : 0) << 8; v |= (endings.hardBad ? 1 : 0) << 9; v |= (endings.hardTrue ? 1 : 0) << 10; v |= (endings.archive ? 1 : 0) << 11;
  v |= (hasTape ? 1 : 0) << 12; v |= (tapeSeen ? 1 : 0) << 13; v |= (chicken ? 1 : 0) << 14; v |= (hardSeen ? 1 : 0) << 15;
  return v;
}
function sumOf(v){ let h = 0x9e3779b1 ^ v; for (let i = 0; i < 3; i++){ h = Math.imul(h ^ (h >>> 15), 0x85ebca6b); h ^= h >>> 13; } return (h >>> 0) & 0xffffff; }
function saveCode(){
  const v = packSave(), c = sumOf(v), bits = [];
  for (let i = 0; i < 16; i++) bits.push((v >> i) & 1); for (let i = 0; i < 24; i++) bits.push((c >> i) & 1);
  let out = ''; for (let i = 0; i < 40; i += 5){ let n = 0; for (let j = 0; j < 5; j++) n |= bits[i + j] << j; out += B32[n]; }
  return `ALICE-${out.slice(0, 4)}-${out.slice(4)}`;
}
function loadCode(str){
  const t = String(str || '').toUpperCase().replace(/^ALICE/, '').replace(/[^A-Z0-9]/g, '').replace(/0/g, 'O').replace(/1/g, 'I');
  if (t.length !== 8) return false;
  const bits = [];
  for (const ch of t){ const n = B32.indexOf(ch === 'O' ? 'Q' : ch === 'I' ? 'J' : ch); if (n < 0) return false; for (let j = 0; j < 5; j++) bits.push((n >> j) & 1); }
  let v = 0, c = 0; for (let i = 0; i < 16; i++) v |= bits[i] << i; for (let i = 0; i < 24; i++) c |= bits[16 + i] << i;
  if ((c >>> 0) !== sumOf(v)) return false;
  progress = (v & 7) + 1; hprog = ((v >> 3) & 7) + 1; completed = !!(v >> 6 & 1); hdone = !!(v >> 7 & 1);
  endings = {}; if (v >> 8 & 1) endings.normal = 1; if (v >> 9 & 1) endings.hardBad = 1; if (v >> 10 & 1) endings.hardTrue = 1; if (v >> 11 & 1) endings.archive = 1;
  hasTape = !!(v >> 12 & 1); tapeSeen = !!(v >> 13 & 1); chicken = !!(v >> 14 & 1); hardSeen = !!(v >> 15 & 1);
  store.set('prog', progress); store.set('hprog', hprog); store.set('done', completed); store.set('hdone', hdone); store.set('endings', endings);
  store.set('tape', hasTape); store.set('tapeSeen', tapeSeen); store.set('chicken', chicken); store.set('hardSeen', hardSeen); store.set('tapePending', false); tapePending = false;
  return true;
}

  go(Static(.5, () => go(Title())));
}
function pauseChoose(i, x){ if (i === 0) setPause(false); else if (i === 1){ bright = x != null && x < W / 2 ? Math.max(0, bright - 1) : (x != null ? Math.min(4, bright + 1) : (bright + 1) % 5); store.set('bright', bright); sfx.tick(); } else if (i === 2){ sens = x != null && x < W / 2 ? Math.max(1, sens - 1) : (x != null ? Math.min(9, sens + 1) : sens % 9 + 1); store.set('sens', sens); sfx.tick(); } else quitToTitle(); }
function pausePointer(t, x, y){
  PAUSE_ROWS.forEach((r, i) => {
    if (y > r.y - 18 && y < r.y + 8 && x > 70 && x < 330) { if (t === 'move') pauseSel = i; if (t === 'down') { pauseSel = i; pauseChoose(i, x); } }
  });
}
function drawPause(){
  g.fillStyle = 'rgba(0,0,0,.72)'; g.fillRect(0, 0, W, H);
  txt('일시정지', W / 2, 112, { size:20, color:'#e3dccf', w:800 });
  PAUSE_ROWS.forEach((r, i) => txt((i === pauseSel ? '› ' : '  ') + (r.bright ? `밝기  ◀ ${'■'.repeat(bright + 1)}${'□'.repeat(4 - bright)} ▶` : r.sens ? `시점 감도  ◀ ${sens} ▶` : r.l), W / 2, r.y, { size:14, color:i === pauseSel ? (i === 3 ? '#ff8a8a' : '#e9e0cf') : '#6f675e', font:MONO }));
  txt('진행 상황은 장 단위로 저장돼요. 다시 하면 그 장 처음부터.', W / 2, 238, { size:10, color:'#7a7166', font:MONO });
  txt(TOUCH ? '' : 'ESC: 계속하기', W / 2, 252, { size:10, color:'#5f5850', font:MONO });
}
const pauseBtn = document.getElementById('pauseBtn');
pauseBtn.addEventListener('click', () => { initAudio(); paused ? setPause(false) : setPause(true); });

/* ---------------- loop ---------------- */
let last = performance.now();
let frameDt = 0;
function frame(ts){
  const dt = Math.min(.05, (ts - last) / 1000); last = ts; now += dt; frameDt = dt;
  if (!paused) tape += osd.mode.startsWith('◀') ? -dt * 30 : dt;
  if (tape < 0) tape = 0;
  fx.glitch = Math.max(0, fx.glitch - dt * 1.6);
  fx.shake = Math.max(0, fx.shake - dt * 18);
  subs.t -= dt;
  if (music.node && music.wow) music.node.playbackRate.setTargetAtTime(.985 + Math.sin(now * .8) * .007 + Math.sin(now * 5.1) * .002, A.ctx.currentTime, .05);
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  const sm = reduced ? .3 : 1;
  g.setTransform(1, 0, 0, 1, (Math.random() - .5) * fx.shake * sm, (Math.random() - .5) * fx.shake * sm);
  if (scene && !paused){ scene.t += dt; if (scene.update) scene.update(dt); }
  if (scene) scene.draw();
  touchUI.hidden = !TOUCH;
  if (TOUCH) for (const b of touchBtns) b.hidden = paused || !(scene && scene.touch === b.dataset.scene);
  if (TOUCH){ tJoy.hidden = paused || !(scene && scene.touch === 'h3d' && !scene.noJoy); tActBtn.textContent = (scene && scene.act) || '행동'; if (scene && scene.noAct) tActBtn.hidden = true; }
  g.setTransform(1, 0, 0, 1, 0, 0);
  if (paused) drawPause();
  pauseBtn.hidden = !canPause() && !paused;
  pauseBtn.textContent = paused ? '▶ 계속' : '■ 정지';
  if (paused) { const m = osd.mode; osd.mode = 'PAUSE ▮▮'; drawSubs(); drawOSD(); osd.mode = m; }
  else { drawHint(dt); drawSubs(); drawOSD(); }
  post(dt);
  requestAnimationFrame(frame);
}

const touchUI = document.getElementById('touchUI');
function vkey(id, k) {
  const btn = document.getElementById(id);
  btn.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation(); initAudio();
    keys[k] = true; if (scene && scene.key) scene.key(k, true);
    try { btn.setPointerCapture(e.pointerId); } catch (_) {}
  });
  const up = () => { keys[k] = false; };
  btn.addEventListener('pointerup', up); btn.addEventListener('pointercancel', up); btn.addEventListener('lostpointercapture', up);
  btn.addEventListener('contextmenu', e => e.preventDefault());
}
vkey('tWalk', 'ArrowUp'); vkey('tSlash', ' '); vkey('tBack', 'ArrowDown'); vkey('tPoint', ' '); vkey('tAct', ' ');
const tActBtn = document.getElementById('tAct');
// 하드 모드 이동용 가상 조이스틱
const joy = { x:0, y:0 }, tJoy = document.getElementById('tJoy'), tJoyKnob = document.getElementById('tJoyKnob');
let joyId = null;
function moveJoy(e){
  const r = tJoy.getBoundingClientRect(), rad = r.width / 2;
  let dx = (e.clientX - (r.left + rad)) / rad, dy = (e.clientY - (r.top + r.height / 2)) / rad;
  if (document.body.classList.contains('rot90')){ const t = dx; dx = dy; dy = -t; }
  const l = Math.hypot(dx, dy); if (l > 1){ dx /= l; dy /= l; }
  joy.x = Math.abs(dx) < .12 ? 0 : dx; joy.y = Math.abs(dy) < .12 ? 0 : dy;
  tJoyKnob.style.transform = `translate(calc(-50% + ${dx * rad * .6}px), calc(-50% + ${dy * rad * .6}px))`;
}
tJoy.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); initAudio(); joyId = e.pointerId; try{ tJoy.setPointerCapture(e.pointerId); }catch(_){} moveJoy(e); });
tJoy.addEventListener('pointermove', e => { if (e.pointerId === joyId) moveJoy(e); });
const endJoy = e => { if (e.pointerId !== joyId) return; joyId = null; joy.x = joy.y = 0; tJoyKnob.style.transform = 'translate(-50%,-50%)'; };
tJoy.addEventListener('pointerup', endJoy); tJoy.addEventListener('pointercancel', endJoy);
const touchBtns = [...touchUI.querySelectorAll('button')];
document.getElementById('muteBtn').addEventListener('click', e => {
  A.muted = !A.muted; e.currentTarget.textContent = A.muted ? '소리 켜기' : '소리 끄기';
  if (A.master) A.master.gain.setTargetAtTime(A.muted ? 0 : .9, A.ctx.currentTime, .05);
});
const orientBtn = document.getElementById('orientBtn'), fsBtn = document.getElementById('fsBtn');
const isPortrait = () => window.matchMedia && matchMedia('(orientation: portrait)').matches;
let landMode = false;
function syncOrientUI(){
  orientBtn.textContent = landMode ? '세로로 돌아가기' : '가로 모드';
  fsBtn.textContent = document.fullscreenElement ? '전체화면 끄기' : '전체화면';
}
async function goLandscape(){
  initAudio();
  try { if (!document.fullscreenElement && document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen({ navigationUI: 'hide' }); } catch (e) {}
  let locked = false;
  try { if (document.fullscreenElement && screen.orientation && screen.orientation.lock) { await screen.orientation.lock('landscape'); locked = true; } } catch (e) {}
  if (!locked && isPortrait()) document.body.classList.add('rot90');
  landMode = true; syncOrientUI();
}
async function goPortrait(){
  document.body.classList.remove('rot90');
  try { if (document.fullscreenElement && screen.orientation && screen.orientation.lock) await screen.orientation.lock('portrait'); } catch (e) { try { screen.orientation.unlock(); } catch (_) {} }
  landMode = false; syncOrientUI();
}
if (TOUCH) { orientBtn.hidden = false; syncOrientUI(); }
orientBtn.addEventListener('click', () => { landMode ? goPortrait() : goLandscape(); });
fsBtn.addEventListener('click', async () => {
  if (TOUCH) {
    if (document.fullscreenElement) { document.body.classList.remove('rot90'); landMode = false; try { await document.exitFullscreen(); } catch (e) {} syncOrientUI(); }
    else await goLandscape();
    return;
  }
  const el = document.getElementById('set');
  try{ if (document.fullscreenElement) document.exitFullscreen(); else if (el.requestFullscreen) el.requestFullscreen().catch(() => {}); }catch(e){}
});
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && !document.body.classList.contains('rot90')) landMode = false;
  syncOrientUI();
});
if (window.matchMedia) {
  const mq = matchMedia('(orientation: portrait)');
  const onOrient = () => { if (!mq.matches && document.body.classList.contains('rot90')) { document.body.classList.remove('rot90'); } };
  mq.addEventListener ? mq.addEventListener('change', onOrient) : mq.addListener(onOrient);
}

const HARD = window.InjooHard ? window.InjooHard({
  W, H, g, cv, keys, ptr, joy, sfx, osc, nz, fx, setFx, drone, say, go, Card, T, txt, ell, poly, cuteGhost, drawFace, heart, vib, MONO, SERIF, OSDF, TOUCH, reduced, hint, stopOpening, playTrack, stopTrack,
  chicken:() => chicken, sens:() => SENS[sens] || 1, now:() => now, scene:() => scene, paused:() => paused, osd, playerName:() => playerName, Title:() => Title(), Static,
  die:(m, f) => die(m, f), startChapter:n => startChapter(n), Jump, CuteJump, darkness, rgb,
  setRoute:r => { hroute = r; store.set('hroute', r); }, gotTape:() => { hasTape = true; store.set('tape', true); }
}) : null;
go(Boot());
requestAnimationFrame(frame);
['touchend', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, () => { initAudio(); }, { passive:true }));
window.__injoo = { dbg:()=>JSON.stringify({ name:music.name, cute:!!TRACKS.cute.el, chicken }), go, Ch1, Ch2, Ch3, Ch4, Room, Title, startChapter, HARD, Options, ChapterSelect, saveCode, loadCode, setHard(v){ hard = !!v; }, setChicken(v){ chicken = !!v; }, get scene(){ return scene; } };
})();
